<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — SISKM AI Solutions</title>
    <meta name="description" content="Start a conversation with SISKM AI Solutions." />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/">
          <img src="/logo.png" width="1054" height="350" alt="SISKM AI Solutions" />
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="/#work">Work</a>
          <a href="/#approach">Approach</a>
          <a href="/about.html">About</a>
          <a class="button" href="/contact.html" aria-current="page">Start a conversation</a>
        </nav>
      </div>
    </header>
    <main id="content">
      <article class="page">
        <div class="wrap">
          <hr class="rule" />
          <h1>Start a conversation</h1>
          <p class="lede">
            A short note is enough. Tell us the team, the workflow, and what better would look like
            in a quarter.
          </p>
          <div class="contact-points">
            <div>
              <h2>New work</h2>
              <p><a href="mailto:hello@siskm.ai">hello@siskm.ai</a></p>
            </div>
            <div>
              <h2>Partnerships</h2>
              <p><a href="mailto:partners@siskm.ai">partners@siskm.ai</a></p>
            </div>
            <div>
              <h2>Careers</h2>
              <p><a href="mailto:careers@siskm.ai">careers@siskm.ai</a></p>
            </div>
          </div>
          <form class="inquiry" action="mailto:hello@siskm.ai" method="post" enctype="text/plain">
            <label>
              Name
              <input type="text" name="name" autocomplete="name" />
            </label>
            <label>
              Company
              <input type="text" name="company" autocomplete="organization" />
            </label>
            <label>
              Email
              <input type="email" name="email" autocomplete="email" required />
            </label>
            <label>
              What is stuck?
              <textarea name="message" required></textarea>
            </label>
            <button class="button" type="submit">Send email</button>
          </form>
        </div>
      </article>
    </main>
    <footer class="site-footer">
      <div class="wrap">
        <p>&copy; 2026 SISKM AI Solutions</p>
      </div>
    </footer>
  </body>
</html>
